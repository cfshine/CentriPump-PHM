name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        env:
          # 单元测试不调用真实模型；仅用于满足客户端初始化时的凭据检查。
          DEEPSEEK_API_KEY: test-key
        run: pytest -q
